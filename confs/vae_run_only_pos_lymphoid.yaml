# Stages to run (toggle on/off)
stages:
  generate_base_matrices: false
  generate_negatives: false
  prepare_dhs: true
  collect_data: true
  train: true
  inference: true
  accessibility_scores: true
  benchmark: true

# Data paths
data:
  input_frags_dir: "vae_full_delfi1_training_raw_data/DELFI1/"
  inference_frags_dir: "vae_full_delfi1_training_raw_data/DELFI_LUCAS/"
  fragment_filename: "frag.tsv.gz"

  training_dhs_dir: "vae_full_delfi1_training_raw_data/lymphoid_dhs/"
  inference_dhs_dir: "vae_full_delfi1_training_raw_data/inference_dhs/"
  hg_38_2bit_file: "vae_full_delfi1_training_raw_data/hg38.2bit"

  training_metadata_path: "vae_full_delfi1_training_raw_data/meta/DELFI1_deduplicated.tsv"
  inference_metadata_path: "vae_full_delfi1_training_raw_data/meta/DELFI_LUCAS_balanced.tsv"

  training_base_matrices: "vae_full_delfi1_training_raw_data/lymphoid_training_frags/"
  inference_base_matrices: "vae_full_delfi1_training_raw_data/inference_frags/"

  # The below folders are automatically generated:
  training_output_dir: "vae_full_delfi1_only_pos_lymphoid_72x192/training_frags/"
  training_min_coverage_file: "vae_full_delfi1_only_pos_lymphoid_72x192/training_frags/min_coverage.txt"
  training_bin_edges_file: "vae_full_delfi1_only_pos_lymphoid_72x192/training_frags/bin_edges.npy"

  inference_output_dir: "vae_full_delfi1_only_pos_lymphoid_72x192/inference/"

  accessibility_scores_dir: "vae_full_delfi1_only_pos_lymphoid_72x192/accessibility_scores/"
  final_matrices_dir: "vae_full_delfi1_only_pos_lymphoid_72x192/final_matrices_without_pca/"


# Matrix
matrix:
  columns: 2500
  rows: 300
  shift: 250


# Negative DHS generation
negative_dhs:
  gc_bias_window: 200
  n_quantile_bins: 20
  max_tries_multiplier: 50

# Model (swap by changing name + checkpoint)
model:
  name: "vae"
  checkpoint: "models/vae_full_delfi1_only_pos_lymphoid_72x192.pt"
  use_rebinned: true
  params: {"latent_dim": 2, "base_channels": 16}


# Preprocessing transforms (applied in order)
# options: "sum_normalization", "log_transform", "standardization", "slice"
preprocessing:
  # coverage handling: downsample | normalize | none
  #   downsample -> multinomial-downsample each matrix to MIN_COV_FILE (or min_cov override)
  #   normalize -> per-sample counts per million (CPM) scaling: matrix * 1e6 / sample_total
  #   none -> feed raw matrices through (requires use_rebinned: true)
  coverage_handling: downsample
  min_cov: 100000  # only used when coverage_handling is set to downsample
  max_sample_loss: 0.2  # only used when coverage_handling is set to downsample
  # transforms: []
  # # example 1: sum normalize
  # transforms:
  #   - name: "sum_normalization"

  # # example 2: slice + sum normalize + log
  # transforms:
  #   - name: "slice"
  #     params: {ymin: 130, ymax: 200, xmin: 600, xmax: 1400}
  #   - name: "sum_normalization"
  #   - name: "log_transform"

  # # example 3: sum normalize + log_transform + standardization
  # transforms:
    # - name: "sum_normalization"
    # - name: "log_transform"
    # - name: "standardization"


# Training hyperparameters
training:
  seed: 42
  train_size: 80
  valid_size: 10
  batch_size: 32
  n_epochs: 200
  patience: 10
  optimizer: "adam"
  learning_rate: 0.00368
  scheduler: "reduce_on_plateau"
  beta: 0.1
  scheduler_params:
    mode: "max"
    patience: 3
    factor: 0.1


# Accessibility score parameters
lwps:
  window_size: 120
  lower_threshold: 120
  upper_threshold: 180
  matrix_shift: 250

fdi:
  window_size: 250
  step_size: 20
  endpoint_window: 10
  x: 0.9
  y: 500
  matrix_shift: 250

ifs:
  window_size: 125
  matrix_shift: 250

pfe:
  window_size: 1500
  min_length: 100
  max_length: 300
  matrix_shift: 250

ocf:
  window_half: 10
  center_offset: 60
  matrix_shift: 250
