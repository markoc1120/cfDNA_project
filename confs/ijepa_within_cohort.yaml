# I-JEPA variant (patchify + ViT) — WITHIN-COHORT setup.
# Trains on ~50% of DELFI1 (part-of-DELFI1), infers on the held-out DELFI1 half.
# Reuses the VAE within-cohort 72x192 training matrices. Train offline via train_ssl.py
# (no search here — paste the winning params from the EXTRA-setup search, confs/ijepa_extra.yaml).

# Stages to run (toggle on/off)
stages:
  generate_base_matrices: false
  generate_negatives: false
  prepare_dhs: true
  collect_data: false
  train: false
  inference: true
  accessibility_scores: false
  benchmark: true

# Data paths (part-of-DELFI1 training + held-out DELFI1 inference)
data:
  input_frags_dir: "mlp_cnn_part_of_delfi1_training_raw_data/training/"
  inference_frags_dir: "vae_part_of_delfi1_training_raw_data/inference/"
  fragment_filename: "frag.tsv.gz"

  training_dhs_dir: "mlp_cnn_part_of_delfi1_training_raw_data/lymphoid_dhs/"
  inference_dhs_dir: "vae_full_delfi1_training_raw_data/inference_dhs/"
  hg_38_2bit_file: "vae_full_delfi1_training_raw_data/hg38.2bit"

  training_metadata_path: "mlp_cnn_part_of_delfi1_training_raw_data/meta/training.tsv"
  inference_metadata_path: "vae_part_of_delfi1_training_raw_data/meta/inference.tsv"

  training_base_matrices: "mlp_cnn_full_delfi1_training_raw_data/lymphoid_training_frags/"
  inference_base_matrices: "vae_full_delfi1_training_raw_data/training_frags/"

  # reuse the VAE within-cohort (part-of-DELFI1) 72x192 training matrices / bin edges / min coverage:
  training_output_dir: "vae_part_of_delfi1_only_pos_lymphoid_72x192/training_frags/"
  training_min_coverage_file: "vae_part_of_delfi1_only_pos_lymphoid_72x192/training_frags/min_coverage.txt"
  training_bin_edges_file: "vae_part_of_delfi1_only_pos_lymphoid_72x192/training_frags/bin_edges.npy"

  inference_output_dir: "ijepa_within_cohort_32x192/inference/"
  accessibility_scores_dir: "ijepa_within_cohort_32x192/accessibility_scores/"
  final_matrices_dir: "ijepa_within_cohort_32x192/final_matrices_without_pca/"


# Matrix
matrix:
  columns: 2500
  rows: 300
  shift: 250


# Negative DHS generation
negative_dhs:
  gc_bias_window: 200
  n_quantile_bins: 20
  max_tries_multiplier: 50

# Model
# patch (12,16) over the 72x192 rebinned matrix -> a 6x12 = 72-token grid.
model:
  name: "ijepa"
  checkpoint: "models/ijepa_within_cohort_32x192.pt"
  use_rebinned: true
  params: {"patch": [8, 16], "input_hw": [32, 192], "embed_dim": 32, "depth": 4, "n_heads": 4, "pred_dim": 32, "pred_depth": 2, "num_target_blocks": 4, "momentum": 0.99, "momentum_end": 1.0, "dropout": 0.1}


# Preprocessing
preprocessing:
  coverage_handling: downsample
  min_cov: 100000
  max_sample_loss: 0.2


# Training hyperparameters
training:
  seed: 42
  train_size: 80
  valid_size: 10
  batch_size: 32
  n_epochs: 200
  patience: 10
  optimizer: "adam"
  vicreg_weight: 1.0
  learning_rate: 0.001
  scheduler: "reduce_on_plateau"
  scheduler_params:
    mode: "max"
    patience: 3
    factor: 0.1


# Accessibility score parameters (only used if stages.accessibility_scores is true)
lwps:
  window_size: 120
  lower_threshold: 120
  upper_threshold: 180
  matrix_shift: 250

fdi:
  window_size: 250
  step_size: 20
  endpoint_window: 10
  x: 0.9
  y: 500
  matrix_shift: 250

ifs:
  window_size: 125
  matrix_shift: 250

pfe:
  window_size: 1500
  min_length: 100
  max_length: 300
  matrix_shift: 250

ocf:
  window_half: 10
  center_offset: 60
  matrix_shift: 250
