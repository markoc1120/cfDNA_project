# I-JEPA variant (patchify + ViT) — EXTRA setup.
# Full DELFI1 (~500) training + independent DELFI_LUCAS inference. This is the config to run the
# hyperparameter search on: `uv run python train_ssl.py --config confs/ijepa_extra.yaml --n-trials 30`.
# Then paste the winning model.params into this + the within-cohort config before inference.

# Stages to run (toggle on/off)
stages:
  generate_base_matrices: false
  generate_negatives: false
  prepare_dhs: true
  collect_data: false
  train: false
  inference: true
  accessibility_scores: false
  benchmark: true

# Data paths
data:
  input_frags_dir: "vae_full_delfi1_training_raw_data/DELFI1/"
  inference_frags_dir: "vae_part_of_delfi1_training_raw_data/inference/"
  fragment_filename: "frag.tsv.gz"

  # training_dhs_dir: "vae_full_delfi1_training_raw_data/lymphoid_dhs/"
  training_dhs_dir: "vae_full_delfi1_training_raw_data/training_dhs/"
  inference_dhs_dir: "vae_full_delfi1_training_raw_data/inference_dhs/"
  hg_38_2bit_file: "vae_full_delfi1_training_raw_data/hg38.2bit"

  training_metadata_path: "vae_full_delfi1_training_raw_data/meta/DELFI1_deduplicated.tsv"
  inference_metadata_path: "vae_part_of_delfi1_training_raw_data/meta/inference.tsv"

  # training_base_matrices: "vae_full_delfi1_training_raw_data/lymphoid_training_frags/"
  training_base_matrices: "vae_full_delfi1_training_raw_data/training_frags/"
  inference_base_matrices: "vae_full_delfi1_training_raw_data/training_frags/"

  # healthy-and-cancer-allDHS
  training_output_dir: "ijepa_extra_72x192/training_within_cohort_frags/"
  training_min_coverage_file: "ijepa_extra_72x192/training_frags/min_coverage.txt"
  training_bin_edges_file: "ijepa_extra_72x192/training_frags/bin_edges.npy"

  inference_output_dir: "ijepa_within_cohort_72x192_healthy_cancer_all/inference/"
  accessibility_scores_dir: "ijepa_within_cohort_72x192_healthy_cancer_all/accessibility_scores/"
  final_matrices_dir: "ijepa_within_cohort_72x192_healthy_cancer_all/final_matrices_without_pca/"


# Matrix
matrix:
  columns: 2500
  rows: 300
  shift: 250


# Negative DHS generation
negative_dhs:
  gc_bias_window: 200
  n_quantile_bins: 20
  max_tries_multiplier: 50

# Model
model:
  name: "ijepa"
  checkpoint: "models/ijepa-within-cohort-healthy-and-cancer-allDHS_72x192.pt"
  use_rebinned: true
  # optimization
  params: {"patch_size": [6, 12], "img_size": [72, 192], "embed_dim": 256, "depth": 4, "num_heads": 4, "pred_dim": 128, "pred_depth": 1, "num_target_blocks": 8, "momentum": 0.99, "momentum_end": 1.0, "drop_rate": 0.2, "row_center_bias": 2.0}


# Preprocessing
preprocessing:
  coverage_handling: downsample
  min_cov: 100000
  max_sample_loss: 0.2


# Training hyperparameters
training:
  seed: 42
  train_size: 80
  valid_size: 10
  batch_size: 32
  n_epochs: 200
  patience: 20
  optimizer: "adam"
  learning_rate: 0.0001
  scheduler: "reduce_on_plateau"
  scheduler_params:
    mode: "max"
    patience: 3
    factor: 0.1


# Accessibility score parameters (only used if stages.accessibility_scores is true)
lwps:
  window_size: 120
  lower_threshold: 120
  upper_threshold: 180
  matrix_shift: 250

fdi:
  window_size: 250
  step_size: 20
  endpoint_window: 10
  x: 0.9
  y: 500
  matrix_shift: 250

ifs:
  window_size: 125
  matrix_shift: 250

pfe:
  window_size: 1500
  min_length: 100
  max_length: 300
  matrix_shift: 250

ocf:
  window_half: 10
  center_offset: 60
  matrix_shift: 250
